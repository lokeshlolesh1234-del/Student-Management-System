    <link rel="stylesheet" href="css/style.css">

        <li>

        </li>

        <li>
            <a href="courses.html">
                <i class="fa-solid fa-book"></i>
                Courses
            </a>
        </li>

        <li class="active">
            <a href="users.html">
                <i class="fa-solid fa-users"></i>
                Users
            </a>
        </li>

        <li>
            <a href="attendance.html">
                <i class="fa-solid fa-calendar-check"></i>

    </ul>

</div>


<div class="main-content">

    <header>
        <h1>User Management</h1>
    </header>


    <div class="container">

        <!-- Add User -->

        <div class="card">

            <h2>Add User</h2>

            <form id="userForm">

                <input type="hidden" id="userId">

                <input
                    type="text"
                    id="name"
                    placeholder="User Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <select id="role" required>

                    <option value="">Select Role</option>

                    <option value="Admin">
                        Admin
                    </option>

                    <option value="Staff">
                        Staff
                    </option>

                </select>

                <button type="submit">
                    Add User
                </button>

            </form>

        </div>


        <!-- User List -->

        <div class="card">

            <h2>User List</h2>

            <input
                type="text"
                id="search"
                placeholder="🔍 Search by name, email, or role..."
                onkeyup="searchUsers()"
            >

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="userTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="js/users.js"></script>

</body>

</html>
