        <li>
            <a href="students.html">

        </li>

        <li>
            <a href="courses.html">
                <i class="fa-solid fa-book"></i>
                Courses
            </a>
        </li>

        <li>
            <a href="users.html">
                <i class="fa-solid fa-users"></i>
                Users
            </a>
        </li>

        <li>
            <a href="attendance.html">
                <i class="fa-solid fa-calendar-check"></i>

        <li>

    </ul>

</div>


<div class="main-content">

    <header>

        <h1>Fees Management</h1>

    </header>


    <div class="container">


        <!-- Fee Form -->

        <div class="card">

            <h2 id="formTitle">Record Fee Payment</h2>

            <form id="feesForm">

                <input
                    type="hidden"
                    id="feesId"
                >

                <select id="student" required>

                    <option value="">
                        Select Student
                    </option>

                </select>


                <input
                    type="number"
                    id="total_fee"
                    placeholder="Total Fee"
                    min="0"
                    step="0.01"
                    required
                >


                <input
                    type="number"
                    id="paid_fee"
                    placeholder="Paid Fee"
                    min="0"
                    step="0.01"
                    required
                >


                <input
                    type="date"
                    id="payment_date"
                    required
                >


                <button type="submit">
                    Save Fee
                </button>

            </form>

        </div>


        <!-- Fees List -->

        <div class="card">

            <h2>Fee Records</h2>


            <input
                type="text"
                id="search"
                placeholder="🔍 Search by student..."
                onkeyup="searchFees()"
            >


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Student</th>

                        <th>Total Fee</th>

                        <th>Paid Fee</th>

                        <th>Balance Fee</th>

                        <th>Payment Date</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="feesTable">

                </tbody>

            </table>

        </div>


    </div>

</div>


<script src="js/auth.js"></script>
<script src="js/fees.js"></script>

</body>

</html>
