    <link rel="stylesheet" href="css/style.css">

</head>

        SMS

    <ul>

        <li>

                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </li>

        <li>
            <a href="students.html">
                <i class="fa-solid fa-user-graduate"></i>
                Students
            </a>
        </li>

        <li>
            <a href="courses.html">
                <i class="fa-solid fa-book"></i>
                Courses
            </a>
        </li>

        <li>
            <a href="users.html">
                <i class="fa-solid fa-users"></i>
                Users
            </a>
        </li>

        <li>
            <a href="attendance.html">
                <i class="fa-solid fa-calendar-check"></i>
                Attendance
            </a>
        </li>

        <li class="active">
            <a href="marks.html">
                <i class="fa-solid fa-square-poll-vertical"></i>

                <i class="fa-solid fa-right-from-bracket"></i>

        </li>

    </ul>

</div>


<div class="main-content">

    <header>

        <h1>Marks Management</h1>

    </header>


    <div class="container">


        <!-- Marks Form -->

        <div class="card">

            <h2>Add Marks</h2>

            <form id="marksForm">

                <input
                    type="hidden"
                    id="marksId"
                >


                <select id="student" required>

                    <option value="">
                        Select Student
                    </option>

                </select>


                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >


                <input
                    type="number"
                    id="internal"
                    placeholder="Internal Marks"
                    min="0"
                    required
                >


                <input
                    type="number"
                    id="external"
                    placeholder="External Marks"
                    min="0"
                    required
                >


                <button type="submit">
                    Save Marks
                </button>

            </form>

        </div>


        <!-- Marks List -->

        <div class="card">

            <h2>Marks List</h2>


            <input
                type="text"
                id="search"
                placeholder="🔍 Search by student or subject..."
                onkeyup="searchMarks()"
            >


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Student</th>

                        <th>Subject</th>

                        <th>Internal</th>

                        <th>External</th>

                        <th>Total</th>

                        <th>Grade</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="marksTable">

                </tbody>

            </table>

        </div>


    </div>

</div>


<script src="js/auth.js"></script>
<script src="js/marks.js"></script>

</body>

</html>
